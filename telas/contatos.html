<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu do Futebol Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../estilo/style.css">
</head>
<script>
    function abrirPopup(nome, imagem, descricao){
        url =`popup.html?produto=${encodeURIComponent(nome)}&imagem=${encodeURIComponent(imagem)}&descricao=${encodeURIComponent(descricao)}` 
        window.open(url, "_blank", "width=850, height=450")
    }
</script>
<body>
    <header>
       <div>
           <a href="index.html"><img src="../img/logo.png" class="logo"></a>
           <nav>
               <ul>
                   <li><a href="../index.html">Home</a></li>
                   <li><a href="exposicoes.html">Exposições</a></li>
                   <li><a href="./contatos.html"  class="active">Contatos</a></li>
               </ul>
           </nav>
       </div>
    </header>

    <main>  
        <section class="form-container hidden">
            <h1>Entre em Contato</h1>
            <form action="">
                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>

     <footer>
        <img src="../img/logo.png" class="logo">
        <h2>Museu do Futebol Virtual | Todos os Direitos Reservados ©</h2>
        <div class="redes_sociais">
            <i class="fa-brands fa-instagram"></i>
            <a href="https://www.instagram.com/museudofutebol/" target="_blank"><h3>@museudofutebol</h3></a>
        </div>
    </footer>
    <script src="../script.js"></script>
</body>
</html>
